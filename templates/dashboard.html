<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harman Kardon ONE — 用户反馈监控</title>
    <style>
        :root {
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #1a1a2e;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --pain: #ef4444;
            --pain-bg: #fef2f2;
            --pain-light: #fee2e2;
            --gain: #10b981;
            --gain-bg: #ecfdf5;
            --gain-light: #d1fae5;
            --neutral: #6b7280;
            --neutral-bg: #f9fafb;
            --accent: #3b82f6;
            --accent-bg: #eff6ff;
            --warning: #f59e0b;
            --warning-bg: #fffbeb;
            --sep: 4px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        /* ---- Header ---- */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 24px;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .logo {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, #1a1a1a, #4a4a4a);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 0.8rem; font-weight: 800; letter-spacing: -0.5px;
            flex-shrink: 0;
        }
        .header h1 { font-size: 1.35rem; font-weight: 700; }
        .header h1 span { color: var(--text-muted); font-weight: 400; font-size: 0.9rem; margin-left: 8px; }

        .actions { display: flex; gap: 8px; align-items: center; }
        .last-updated { font-size: 0.75rem; color: var(--text-muted); }

        .btn {
            padding: 7px 16px; border-radius: 8px; font-size: 0.82rem; font-weight: 500;
            cursor: pointer; border: 1px solid var(--border); background: white;
            color: var(--text); transition: all 0.2s;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn:hover { background: var(--bg); }
        .btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
        .btn-primary:hover { background: #2563eb; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ---- Stat Cards ---- */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--card-bg); border-radius: 12px;
            padding: 18px 16px; border: 1px solid var(--border);
            text-align: center;
        }
        .stat-card .number { font-size: 2.2rem; font-weight: 800; line-height: 1.1; }
        .stat-card .label { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
        .stat-card .sub { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }
        .stat-card.total .number { color: var(--accent); }
        .stat-card.pain .number { color: var(--pain); }
        .stat-card.gain .number { color: var(--gain); }
        .stat-card.neutral .number { color: var(--neutral); }

        /* ---- Section ---- */
        .section {
            background: var(--card-bg); border-radius: 12px;
            border: 1px solid var(--border); margin-bottom: 20px; overflow: hidden;
        }
        .section-header {
            padding: 14px 20px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 8px;
        }
        .section-title { font-size: 0.95rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .section-title .badge {
            font-size: 0.72rem; padding: 2px 8px; border-radius: 10px; font-weight: 600;
        }
        .badge.pain { background: var(--pain-bg); color: var(--pain); }
        .badge.gain { background: var(--gain-bg); color: var(--gain); }
        .badge.neutral { background: var(--neutral-bg); color: var(--neutral); }
        .badge.all { background: var(--accent-bg); color: var(--accent); }

        /* ---- Category Grid ---- */
        .cat-grid {
            padding: 16px 20px;
            display: flex; flex-direction: column; gap: 16px;
        }

        .cat-card {
            border: 1px solid var(--border); border-radius: 10px;
            overflow: hidden; transition: box-shadow 0.2s;
        }
        .cat-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .cat-card.pain { border-left: 3px solid var(--pain); }
        .cat-card.gain { border-left: 3px solid var(--gain); }

        .cat-top {
            padding: 14px 16px;
            display: flex; align-items: flex-start; gap: 12px;
        }
        .cat-icon { font-size: 1.4rem; flex-shrink: 0; }
        .cat-info { flex: 1; min-width: 0; }
        .cat-name { font-size: 0.9rem; font-weight: 600; color: var(--text); }
        .cat-zh { font-size: 0.78rem; color: var(--text-muted); margin-top: 1px; }
        .cat-desc { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; line-height: 1.5; }

        .cat-stats {
            display: flex; align-items: center; gap: 12px; flex-shrink: 0;
        }
        .cat-count { font-size: 1.6rem; font-weight: 800; }
        .cat-card.pain .cat-count { color: var(--pain); }
        .cat-card.gain .cat-count { color: var(--gain); }
        .cat-pct { font-size: 0.75rem; color: var(--text-muted); }

        .severity-badge {
            font-size: 0.65rem; padding: 2px 6px; border-radius: 4px;
            font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px;
        }
        .severity-badge.high { background: #fee2e2; color: #b91c1c; }
        .severity-badge.medium { background: var(--warning-bg); color: #b45309; }
        .severity-badge.low { background: var(--neutral-bg); color: var(--text-muted); }

        /* Progress bar */
        .cat-bar-wrap {
            padding: 0 16px 14px;
        }
        .cat-bar {
            height: 6px; border-radius: 3px; background: var(--border);
            overflow: hidden;
        }
        .cat-bar-fill {
            height: 100%; border-radius: 3px;
            transition: width 0.6s ease;
        }
        .cat-card.pain .cat-bar-fill { background: var(--pain); }
        .cat-card.gain .cat-bar-fill { background: var(--gain); }

        /* Examples */
        .examples { border-top: 1px solid var(--border); }
        .examples-header {
            padding: 10px 16px; font-size: 0.75rem; color: var(--text-muted);
            font-weight: 500; background: #fafbfc; cursor: pointer;
            display: flex; align-items: center; gap: 6px;
        }
        .examples-header:hover { background: #f3f4f6; }
        .examples-body { display: none; padding: 12px 16px; }
        .examples-body.open { display: block; }
        .ex-item {
            padding: 10px 12px; border-radius: 8px; margin-bottom: 8px;
            border-left: 3px solid var(--border);
            background: #fafbfc;
        }
        .ex-item:last-child { margin-bottom: 0; }
        .cat-card.pain .ex-item { border-left-color: var(--pain); }
        .cat-card.gain .ex-item { border-left-color: var(--gain); }
        .ex-text { font-size: 0.8rem; color: var(--text); line-height: 1.55; }
        .ex-meta { display: flex; gap: 10px; margin-top: 6px; font-size: 0.7rem; color: var(--text-muted); }
        .ex-meta .rating { color: #fbbf24; }
        .ex-zh { font-size: 0.75rem; color: var(--text-muted); margin-top: 5px; font-style: italic; }

        /* ---- Summary bar ---- */
        .summary-bar {
            padding: 10px 20px; background: var(--accent-bg);
            font-size: 0.75rem; color: var(--text-muted);
            border-top: 1px solid var(--border);
            display: flex; gap: 16px; flex-wrap: wrap;
        }
        .summary-bar strong { color: var(--text); }

        /* ---- Trend ---- */
        .trend-chart {
            padding: 16px 20px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .chart-row {
            display: flex; gap: 4px; align-items: flex-end; height: 80px;
        }
        .chart-col {
            flex: 1; display: flex; flex-direction: column; gap: 2px;
            align-items: center; height: 100%; justify-content: flex-end;
        }
        .chart-stack {
            width: 100%; display: flex; flex-direction: column; gap: 1px;
            border-radius: 2px 2px 0 0; overflow: hidden;
        }
        .seg { flex-shrink: 0; min-height: 2px; }
        .seg.pain { background: var(--pain); }
        .seg.gain { background: var(--gain); }
        .seg.neutral { background: var(--neutral); }
        .chart-date { font-size: 0.6rem; color: var(--text-muted); margin-top: 3px; }

        .legend { display: flex; gap: 14px; justify-content: center; margin-top: 8px; }
        .legend-item { display: flex; align-items: center; gap: 4px; font-size: 0.72rem; color: var(--text-muted); }
        .legend-dot { width: 9px; height: 9px; border-radius: 50%; }
        .legend-dot.pain { background: var(--pain); }
        .legend-dot.gain { background: var(--gain); }
        .legend-dot.neutral { background: var(--neutral); }

        /* ---- Raw feedback list ---- */
        .fb-item {
            padding: 14px 20px; border-bottom: 1px solid var(--border);
            display: flex; gap: 12px; transition: background 0.15s;
        }
        .fb-item:last-child { border-bottom: none; }
        .fb-item:hover { background: #fafbfc; }
        .fb-item.pain { border-left: 3px solid var(--pain); }
        .fb-item.gain { border-left: 3px solid var(--gain); }
        .fb-item.neutral { border-left: 3px solid var(--neutral); }
        .fb-badge {
            flex-shrink: 0; width: 32px; height: 32px; border-radius: 7px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.65rem; font-weight: 700; color: white;
        }
        .fb-badge.gp { background: #00b060; }
        .fb-badge.rd { background: #ff4500; }
        .fb-body { flex: 1; min-width: 0; }
        .fb-text { font-size: 0.83rem; color: var(--text); line-height: 1.55; }
        .fb-meta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 5px; font-size: 0.72rem; color: var(--text-muted); }
        .fb-meta .rating { color: #fbbf24; }
        .fb-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
        .fb-tag { font-size: 0.65rem; padding: 1px 6px; border-radius: 4px; }
        .fb-tag.pain { background: var(--pain-bg); color: var(--pain); }
        .fb-tag.gain { background: var(--gain-bg); color: var(--gain); }

        /* ---- Filters ---- */
        .filters {
            background: var(--card-bg); border-radius: 12px;
            padding: 12px 16px; border: 1px solid var(--border);
            margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
        }
        .filter-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }
        .filter-btn {
            padding: 5px 13px; border-radius: 20px; font-size: 0.75rem; font-weight: 500;
            cursor: pointer; border: 1px solid var(--border); background: white;
            color: var(--text); transition: all 0.2s;
        }
        .filter-btn:hover { border-color: var(--accent); }
        .filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        /* ---- Tab nav ---- */
        .tab-nav {
            display: flex; gap: 0; margin-bottom: 20px;
            background: var(--card-bg); border-radius: 12px;
            border: 1px solid var(--border); overflow: hidden;
        }
        .tab-btn {
            flex: 1; padding: 12px 8px; text-align: center; font-size: 0.85rem;
            font-weight: 500; cursor: pointer; border: none; background: transparent;
            color: var(--text-muted); transition: all 0.2s; border-bottom: 2px solid transparent;
        }
        .tab-btn:hover { color: var(--text); }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); background: var(--accent-bg); }
        .tab-btn .tab-count {
            display: inline-block; margin-left: 4px; font-size: 0.7rem;
            padding: 1px 5px; border-radius: 8px; font-weight: 600;
        }
        .tab-btn .tab-count.pain { background: var(--pain-bg); color: var(--pain); }
        .tab-btn .tab-count.gain { background: var(--gain-bg); color: var(--gain); }
        .tab-btn .tab-count.neutral { background: var(--neutral-bg); color: var(--neutral); }

        /* ---- Toast ---- */
        .toast {
            position: fixed; bottom: 24px; right: 24px;
            background: var(--text); color: white;
            padding: 11px 18px; border-radius: 10px;
            font-size: 0.82rem; font-weight: 500;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            opacity: 0; transform: translateY(20px);
            transition: all 0.3s; z-index: 1000;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { background: var(--pain); }

        .spinner {
            display: inline-block; width: 13px; height: 13px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%; border-top-color: white;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .footer {
            text-align: center; padding: 20px; color: var(--text-muted); font-size: 0.73rem;
        }
        .footer a { color: var(--accent); text-decoration: none; }

        /* ---- Responsive ---- */
        @media (max-width: 640px) {
            .container { padding: 12px 10px; }
            .stats { grid-template-columns: repeat(2, 1fr); }
            .stat-card .number { font-size: 1.6rem; }
            .cat-top { flex-direction: column; }
            .tab-btn { font-size: 0.78rem; padding: 10px 4px; }
        }

        .hidden { display: none !important; }

        /* Pie chart */
        .pie-wrap { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
        .pie-svg { flex-shrink: 0; }
        .pie-legend { display: flex; flex-direction: column; gap: 8px; }
        .pie-legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; }
        .pie-legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .pie-legend-label { color: var(--text-muted); }
        .pie-legend-val { font-weight: 600; margin-left: auto; padding-left: 12px; }
    </style>
</head>
<body>
<div class="container">

    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="logo">HK</div>
            <h1>Harman Kardon ONE<span>用户反馈监控</span></h1>
        </div>
        <div class="actions">
            <span class="last-updated" id="lastUpdated"></span>
            <button class="btn btn-primary" id="scrapeBtn" onclick="triggerScrape()">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
                </svg>
                立即抓取
            </button>
        </div>
    </div>

    <!-- Stat Cards -->
    <div class="stats">
        <div class="stat-card total">
            <div class="number" id="statTotal">0</div>
            <div class="label">总反馈</div>
        </div>
        <div class="stat-card pain">
            <div class="number" id="statPain">0</div>
            <div class="label">用户痛点</div>
            <div class="sub" id="statPainPct"></div>
        </div>
        <div class="stat-card gain">
            <div class="number" id="statGain">0</div>
            <div class="label">用户爽点</div>
            <div class="sub" id="statGainPct"></div>
        </div>
        <div class="stat-card neutral">
            <div class="number" id="statNeutral">0</div>
            <div class="label">中性评价</div>
            <div class="sub" id="statNeutralPct"></div>
        </div>
    </div>

    <!-- Pie chart + trend -->
    <div class="section" style="margin-bottom:16px;">
        <div class="section-header">
            <div class="section-title">📊 整体分布</div>
        </div>
        <div style="padding:16px 20px; display:flex; flex-wrap:wrap; gap:24px; align-items:center;">
            <div class="pie-wrap" id="pieWrap">
                <svg class="pie-svg" width="110" height="110" viewBox="0 0 110 110">
                    <circle id="pieBg" cx="55" cy="55" r="45" fill="none" stroke="#e5e7eb" stroke-width="18"/>
                    <circle id="piePain" cx="55" cy="55" r="45" fill="none" stroke="#ef4444" stroke-width="18"
                        stroke-dasharray="0 283" stroke-dashoffset="70.75" stroke-linecap="round"/>
                    <circle id="pieGain" cx="55" cy="55" r="45" fill="none" stroke="#10b981" stroke-width="18"
                        stroke-dasharray="0 283" stroke-dashoffset="70.75" stroke-linecap="round"/>
                    <circle id="pieNeutral" cx="55" cy="55" r="45" fill="none" stroke="#6b7280" stroke-width="18"
                        stroke-dasharray="0 283" stroke-dashoffset="70.75" stroke-linecap="round"/>
                    <text x="55" y="50" text-anchor="middle" font-size="16" font-weight="800" fill="#1a1a2e" id="pieCenter">0</text>
                    <text x="55" y="64" text-anchor="middle" font-size="9" fill="#6b7280">总条数</text>
                </svg>
                <div class="pie-legend">
                    <div class="pie-legend-item">
                        <div class="pie-legend-dot" style="background:#ef4444"></div>
                        <span class="pie-legend-label">痛点</span>
                        <span class="pie-legend-val" id="piePainLabel">0</span>
                    </div>
                    <div class="pie-legend-item">
                        <div class="pie-legend-dot" style="background:#10b981"></div>
                        <span class="pie-legend-label">爽点</span>
                        <span class="pie-legend-val" id="pieGainLabel">0</span>
                    </div>
                    <div class="pie-legend-item">
                        <div class="pie-legend-dot" style="background:#6b7280"></div>
                        <span class="pie-legend-label">中性</span>
                        <span class="pie-legend-val" id="pieNeutralLabel">0</span>
                    </div>
                </div>
            </div>
            <div style="flex:1; min-width:200px;">
                <div id="trendChart" class="trend-chart"></div>
                <div class="legend">
                    <div class="legend-item"><div class="legend-dot pain"></div>痛点</div>
                    <div class="legend-item"><div class="legend-dot gain"></div>爽点</div>
                    <div class="legend-item"><div class="legend-dot neutral"></div>中性</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tab Nav -->
    <div class="tab-nav">
        <button class="tab-btn active" onclick="switchTab('pain')">
            😤 痛点分析 <span class="tab-count pain" id="tabPainCount">0</span>
        </button>
        <button class="tab-btn" onclick="switchTab('gain')">
            ✨ 爽点分析 <span class="tab-count gain" id="tabGainCount">0</span>
        </button>
        <button class="tab-btn" onclick="switchTab('raw')">
            📋 原始反馈 <span class="tab-count all" id="tabRawCount">0</span>
        </button>
    </div>

    <!-- PAIN TAB -->
    <div id="painTab">
        <div class="section">
            <div class="section-header">
                <div class="section-title">😤 痛点分类 — 按影响面排序</div>
                <span class="badge pain" id="painCatCount">0 个类别</span>
            </div>
            <div class="summary-bar" id="painSummary"></div>
            <div class="cat-grid" id="painCatGrid"></div>
        </div>
    </div>

    <!-- GAIN TAB -->
    <div id="gainTab" class="hidden">
        <div class="section">
            <div class="section-header">
                <div class="section-title">✨ 爽点分类 — 按提及频率排序</div>
                <span class="badge gain" id="gainCatCount">0 个类别</span>
            </div>
            <div class="summary-bar" id="gainSummary"></div>
            <div class="cat-grid" id="gainCatGrid"></div>
        </div>
    </div>

    <!-- RAW TAB -->
    <div id="rawTab" class="hidden">
        <div class="filters">
            <span class="filter-label">情感:</span>
            <button class="filter-btn active" data-filter="all" onclick="filterRaw('all')">全部</button>
            <button class="filter-btn" data-filter="pain" onclick="filterRaw('pain')">痛点</button>
            <button class="filter-btn" data-filter="gain" onclick="filterRaw('gain')">爽点</button>
            <button class="filter-btn" data-filter="neutral" onclick="filterRaw('neutral')">中性</button>
        </div>
        <div id="rawList"></div>
    </div>

    <!-- Footer -->
    <div class="footer">
        Harman Kardon ONE 用户反馈监控 · 每日自动抓取 · 数据来源：Google Play<br>
        <a href="https://play.google.com/store/apps/details?id=com.harmankardon.oneapp" target="_blank">Google Play 商店页 →</a>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
    // ---- Data ----
    let issuesData = null;
    let rawFeedback = [];
    let currentRawFilter = 'all';

    // ---- Init ----
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('lastUpdated').textContent = '更新: ' + new Date().toLocaleString('zh-CN');
        loadIssues();
        loadRaw();
    });

    // ---- Toast ----
    function showToast(msg, isError=false) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast' + (isError ? ' error' : '') + ' show';
        setTimeout(() => t.classList.remove('show'), 3500);
    }

    // ---- Load Issues ----
    async function loadIssues() {
        try {
            const resp = await fetch('/api/issues');
            issuesData = await resp.json();
            renderStats(issuesData);
            renderPainCats(issuesData.pain_categories, issuesData.total);
            renderGainCats(issuesData.gain_categories, issuesData.total);
            renderTrend(issuesData);
        } catch(e) { showToast('加载失败: ' + e.message, true); }
    }

    // ---- Load Raw ----
    async function loadRaw() {
        try {
            const resp = await fetch('/');
            const parser = new DOMParser();
            const doc = parser.parseFromString(await resp.text(), 'text/html');
            const items = doc.querySelectorAll('.feedback-item');
            rawFeedback = Array.from(items).map(el => ({
                sentiment: el.dataset.sentiment,
                source: el.dataset.source,
                title: el.dataset.title || '',
                body: el.dataset.body || '',
            }));
            renderRaw(currentRawFilter);
            document.getElementById('tabRawCount').textContent = rawFeedback.length;
        } catch(e) { console.error(e); }
    }

    // ---- Stats ----
    function renderStats(d) {
        const t = d.total || 1;
        const p = d.pain_categories ? d.pain_categories.reduce((s,c) => s + c.count, 0) : 0;
        const g = d.gain_categories ? d.gain_categories.reduce((s,c) => s + c.count, 0) : 0;
        const painCount = rawFeedback.filter(f => f.sentiment === 'pain').length || p;
        const gainCount = rawFeedback.filter(f => f.sentiment === 'gain').length || g;
        const neutralCount = rawFeedback.filter(f => f.sentiment === 'neutral').length || (d.total - painCount - gainCount);
        const total = d.total || rawFeedback.length || 1;

        document.getElementById('statTotal').textContent = total;
        document.getElementById('statPain').textContent = painCount;
        document.getElementById('statGain').textContent = gainCount;
        document.getElementById('statNeutral').textContent = neutralCount;
        document.getElementById('statPainPct').textContent = Math.round(painCount/total*100) + '%';
        document.getElementById('statGainPct').textContent = Math.round(gainCount/total*100) + '%';
        document.getElementById('statNeutralPct').textContent = Math.round(neutralCount/total*100) + '%';

        document.getElementById('tabPainCount').textContent = painCount;
        document.getElementById('tabGainCount').textContent = gainCount;
        document.getElementById('pieCenter').textContent = total;
        document.getElementById('piePainLabel').textContent = painCount + ' (' + Math.round(painCount/total*100) + '%)';
        document.getElementById('pieGainLabel').textContent = gainCount + ' (' + Math.round(gainCount/total*100) + '%)';
        document.getElementById('pieNeutralLabel').textContent = neutralCount + ' (' + Math.round(neutralCount/total*100) + '%)';

        // Pie segments
        const circ = 2 * Math.PI * 45;
        let offset = 0;
        const painPct = painCount / total;
        const gainPct = gainCount / total;
        const neutralPct = neutralCount / total;

        document.getElementById('piePain').setAttribute('stroke-dasharray', (painPct * circ) + ' ' + circ);
        document.getElementById('piePain').setAttribute('stroke-dashoffset', -offset);
        offset += painPct * circ;

        document.getElementById('pieGain').setAttribute('stroke-dasharray', (gainPct * circ) + ' ' + circ);
        document.getElementById('pieGain').setAttribute('stroke-dashoffset', -offset);
        offset += gainPct * circ;

        document.getElementById('pieNeutral').setAttribute('stroke-dasharray', (neutralPct * circ) + ' ' + circ);
        document.getElementById('pieNeutral').setAttribute('stroke-dashoffset', -offset);
    }

    // ---- Pain Categories ----
    function renderPainCats(cats, total) {
        const grid = document.getElementById('painCatGrid');
        const summary = document.getElementById('painSummary');

        if (!cats || cats.length === 0) {
            grid.innerHTML = '<div style="padding:32px;text-align:center;color:var(--text-muted);font-size:0.85rem;">暂无痛点数据</div>';
            return;
        }

        const totalPain = cats.reduce((s,c) => s + c.count, 0);
        const unclassified = issuesData ? issuesData.unclassified_pain : 0;
        document.getElementById('painCatCount').textContent = cats.length + ' 个类别';
        summary.innerHTML = `<span>共 <strong>${totalPain}</strong> 条已归类痛点</span>
            ${unclassified > 0 ? `<span>另有 <strong>${unclassified}</strong> 条未分类反馈</span>` : ''}`;

        grid.innerHTML = cats.map(cat => {
            const barW = Math.round(cat.count / total * 100);
            const sevColor = {high:'severity-badge high', medium:'severity-badge medium', low:'severity-badge low'}[cat.severity];
            const sevText = {high:'⚠ 高优先级', medium:'中优先级', low:'低优先级'}[cat.severity];
            return `
            <div class="cat-card pain">
                <div class="cat-top">
                    <div class="cat-icon">🔴</div>
                    <div class="cat-info">
                        <div class="cat-name">${cat.category}</div>
                        <div class="cat-zh">${cat.zh}</div>
                        <div class="cat-desc">${cat.description}</div>
                    </div>
                    <div class="cat-stats">
                        <div class="cat-count">${cat.count}</div>
                        <div>
                            <div class="cat-pct">${cat.pct}%</div>
                            <div class="${sevColor}">${sevText}</div>
                        </div>
                    </div>
                </div>
                <div class="cat-bar-wrap">
                    <div class="cat-bar"><div class="cat-bar-fill" style="width:${barW}%"></div></div>
                </div>
                ${cat.examples && cat.examples.length > 0 ? `
                <div class="examples">
                    <div class="examples-header" onclick="this.nextElementSibling.classList.toggle('open')">
                        📝 查看典型案例（${cat.examples.length} 条） ▾
                    </div>
                    <div class="examples-body">
                        ${cat.examples.map(ex => `
                        <div class="ex-item">
                            <div class="ex-text">"${ex.body.substring(0, 200)}"</div>
                            <div class="ex-meta">
                                ${ex.rating ? `<span class="rating">${'★'.repeat(ex.rating)}${'☆'.repeat(5-ex.rating)}</span>` : ''}
                                ${ex.source ? `<span>${ex.source === 'googleplay' ? 'Google Play' : ex.source}</span>` : ''}
                                <span>${ex.date}</span>
                            </div>
                        </div>
                        `).join('')}
                    </div>
                </div>` : ''}
            </div>`;
        }).join('');
    }

    // ---- Gain Categories ----
    function renderGainCats(cats, total) {
        const grid = document.getElementById('gainCatGrid');
        const summary = document.getElementById('gainSummary');

        if (!cats || cats.length === 0) {
            grid.innerHTML = '<div style="padding:32px;text-align:center;color:var(--text-muted);font-size:0.85rem;">暂无爽点数据</div>';
            return;
        }

        const totalGain = cats.reduce((s,c) => s + c.count, 0);
        document.getElementById('gainCatCount').textContent = cats.length + ' 个类别';
        summary.innerHTML = `<span>共 <strong>${totalGain}</strong> 条已归类爽点</span>`;

        grid.innerHTML = cats.map(cat => {
            const barW = Math.round(cat.count / total * 100);
            return `
            <div class="cat-card gain">
                <div class="cat-top">
                    <div class="cat-icon">🟢</div>
                    <div class="cat-info">
                        <div class="cat-name">${cat.category}</div>
                        <div class="cat-zh">${cat.zh}</div>
                        <div class="cat-desc">${cat.description}</div>
                    </div>
                    <div class="cat-stats">
                        <div class="cat-count">${cat.count}</div>
                        <div class="cat-pct">${cat.pct}%</div>
                    </div>
                </div>
                <div class="cat-bar-wrap">
                    <div class="cat-bar"><div class="cat-bar-fill" style="width:${barW}%"></div></div>
                </div>
                ${cat.examples && cat.examples.length > 0 ? `
                <div class="examples">
                    <div class="examples-header" onclick="this.nextElementSibling.classList.toggle('open')">
                        📝 查看典型案例（${cat.examples.length} 条） ▾
                    </div>
                    <div class="examples-body">
                        ${cat.examples.map(ex => `
                        <div class="ex-item">
                            <div class="ex-text">"${ex.body.substring(0, 200)}"</div>
                            <div class="ex-meta">
                                ${ex.rating ? `<span class="rating">${'★'.repeat(ex.rating)}${'☆'.repeat(5-ex.rating)}</span>` : ''}
                                ${ex.source ? `<span>${ex.source === 'googleplay' ? 'Google Play' : ex.source}</span>` : ''}
                                <span>${ex.date}</span>
                            </div>
                        </div>
                        `).join('')}
                    </div>
                </div>` : ''}
            </div>`;
        }).join('');
    }

    // ---- Trend Chart ----
    function renderTrend(d) {
        const container = document.getElementById('trendChart');
        if (!d.trend || d.trend.length === 0) {
            container.innerHTML = '<div style="text-align:center;color:var(--text-muted);font-size:0.8rem;padding:16px;">暂无趋势数据</div>';
            return;
        }
        const byDate = {};
        for (const r of d.trend) {
            if (!byDate[r.date]) byDate[r.date] = {pain:0, gain:0, neutral:0};
            byDate[r.date][r.sentiment] = r.count;
        }
        const dates = Object.keys(byDate).sort();
        if (dates.length === 0) return;
        const maxVal = Math.max(...d.trend.map(r => r.count), 1);

        container.innerHTML = dates.map(d => {
            const v = byDate[d];
            const total = v.pain + v.gain + v.neutral;
            const ph = Math.max(2, (v.pain / maxVal) * 80);
            const gh = Math.max(2, (v.gain / maxVal) * 80);
            const nh = Math.max(2, (v.neutral / maxVal) * 80);
            const label = d.slice(5);
            return `<div class="chart-col">
                <div class="chart-stack" style="height:80px;justify-content:flex-end;">
                    <div class="seg pain" style="height:${ph}px" title="痛点:${v.pain}"></div>
                    <div class="seg gain" style="height:${gh}px" title="爽点:${v.gain}"></div>
                    <div class="seg neutral" style="height:${nh}px" title="中性:${v.neutral}"></div>
                </div>
                <div class="chart-date">${label}</div>
            </div>`;
        }).join('');
    }

    // ---- Tabs ----
    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        event.target.closest('.tab-btn').classList.add('active');
        document.getElementById('painTab').classList.toggle('hidden', tab !== 'pain');
        document.getElementById('gainTab').classList.toggle('hidden', tab !== 'gain');
        document.getElementById('rawTab').classList.toggle('hidden', tab !== 'raw');
    }

    // ---- Raw list ----
    function renderRaw(filter) {
        const list = document.getElementById('rawList');
        const items = rawFeedback.filter(f => filter === 'all' || f.sentiment === filter);
        if (items.length === 0) {
            list.innerHTML = '<div class="section"><div style="padding:40px;text-align:center;color:var(--text-muted);font-size:0.85rem;">暂无数据</div></div>';
            return;
        }
        list.innerHTML = items.map(item => `
            <div class="section">
                <div class="fb-item ${item.sentiment}-item">
                    <div class="fb-badge ${item.source === 'googleplay' ? 'gp' : 'rd'}">
                        ${item.source === 'googleplay' ? 'GP' : 'R'}
                    </div>
                    <div class="fb-body">
                        ${item.title ? `<div class="fb-text" style="font-weight:600;margin-bottom:4px;">${item.title}</div>` : ''}
                        <div class="fb-text">${item.body || '（无正文）'}</div>
                        <div class="fb-meta">
                            <span class="fb-tag ${item.sentiment}">${{pain:'😤 痛点', gain:'✨ 爽点', neutral:'💬 中性'}[item.sentiment] || item.sentiment}</span>
                        </div>
                    </div>
                </div>
            </div>`).join('');
    }

    function filterRaw(filter) {
        currentRawFilter = filter;
        document.querySelectorAll('.filter-btn[data-filter]').forEach(b => {
            b.classList.toggle('active', b.dataset.filter === filter);
        });
        renderRaw(filter);
    }

    // ---- Scrape ----
    async function triggerScrape() {
        const btn = document.getElementById('scrapeBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> 抓取中...';
        showToast('正在抓取评论，大概需要 1-2 分钟...');
        try {
            await fetch('/api/refresh', {method:'POST'});
            setTimeout(() => location.reload(), 90000);
        } catch(e) {
            showToast('抓取失败: ' + e.message, true);
            btn.disabled = false;
            btn.innerHTML = '立即抓取';
        }
    }
</script>
</body>
</html>
